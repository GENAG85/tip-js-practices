<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ПР4 — браузерные проверки</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./checks/browser.checks.js"></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">ПР4 / автоматические проверки</p>
      <h1>Браузерные проверки</h1>
      <p><a href="./index.html">Вернуться к приложению</a></p>
    </header>
    <section class="panel">
      <h2>Результат</h2>
      <p id="check-summary">Проверки выполняются…</p>
      <ol id="check-results" class="check-list"></ol>
      <h2>Текстовый протокол</h2>
      <pre id="check-log"></pre>
    </section>
    <section class="panel">
      <h2>Тестовое приложение</h2>
      <iframe id="test-frame" class="test-preview" title="Тестовое приложение"></iframe>
    </section>
    <div id="test-fixture" class="test-fixture" aria-hidden="true"></div>
  </main>
</body>
</html>
