<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ПР4 — эксперименты с формой и storage</title>
  <link rel="stylesheet" href="../styles.css">
  <script type="module" src="./forms-storage.js"></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">ПР4 / эксперименты</p>
      <h1>Форма, FormData, JSON и localStorage</h1>
      <p><a href="../index.html">Вернуться к приложению</a></p>
    </header>
    <section class="panel lab-card">
      <form id="lab-form">
        <div class="form-grid">
          <div class="field"><label for="lab-id">ID</label><input id="lab-id" name="id" type="number" min="1" step="1" required value="20"></div>
          <div class="field field-wide"><label for="lab-title">Название</label><input id="lab-title" name="title" required maxlength="100"></div>
          <div class="field"><label for="lab-priority">Приоритет</label><select id="lab-priority" name="priority"><option value="medium">medium</option><option value="low">low</option><option value="high">high</option></select></div>
        </div>
        <div class="form-actions"><button type="submit">Сохранить корректные значения</button><button id="read" type="button">Прочитать</button><button id="break" type="button">Записать broken JSON</button><button id="clear" type="button">Очистить ключ</button></div>
      </form>
      <pre id="lab-log">Журнал эксперимента появится здесь.</pre>
    </section>
  </main>
</body>
</html>
